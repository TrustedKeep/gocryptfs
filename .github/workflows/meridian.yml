# Meridian engineering analysis (https://github.com/twosixtech/meridian).
#
# Runs Meridian's own reusable workflow daily on the default branch. That
# workflow reads and scans this repository's code (never builds or runs
# it), analyzes it with Claude on Bedrock, and uploads the encrypted
# results to Meridian over the company tailnet. Nothing here needs a
# secret: identity is GitHub's OIDC token.
name: meridian

on:
  schedule:
    - cron: "33 7 * * *"
  workflow_dispatch: {}

jobs:
  meridian:
    uses: twosixtech/meridian/.github/workflows/analyze.yml@analyze-v1
    with:
      mode: full
    permissions:
      contents: read
      id-token: write
